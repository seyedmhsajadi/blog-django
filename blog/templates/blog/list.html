{% extends 'parent/base.html' %}
{% block title %}post list{% endblock %}
{% block content %}
    {% for post in posts %}
        <h2><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h2>
        <p>{{ post.description|truncatewords:1 }}</p>
    {% endfor %}


    {% include "partials/pagination.html" with page=page_obj%}
{% endblock %}
